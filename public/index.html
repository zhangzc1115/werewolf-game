<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀 Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js" defer></script>
</head>
<body>
    <button id="hard-reset-btn" type="button" onclick="hardResetGame()">Hard Reset</button>
    <div id="app">
        <div id="login" class="screen">
            <h1>狼人杀 Pro</h1>
            <input type="text" id="username" placeholder="输入名字">
            <button onclick="joinGame()">加入游戏</button>
            <div class="divider">或者</div>
            <button class="btn-admin" onclick="initAdmin()">我是上帝(房主)</button>
        </div>

        <div id="lobby" class="screen hidden">
            <h2>等待玩家...</h2>
            <div id="player-list"></div>
            <div id="waiting-msg">请等待上帝开始游戏</div>
            <div class="role-settings">
                <h3>自主持配置</h3>
                <div class="role-grid">
                    <div class="role-item"><span>狼人</span><input id="lobby-role-wolf" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>狼枪</span><input id="lobby-role-wolfKing" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>女巫</span><input id="lobby-role-witch" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>预言家</span><input id="lobby-role-seer" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>猎人</span><input id="lobby-role-hunter" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>白痴</span><input id="lobby-role-idiot" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>混血儿</span><input id="lobby-role-hybrid" type="number" min="0" value="1"></div>
                </div>
            </div>
            <button onclick="startSelfModeratedGame()">玩家自主持开始</button>
            <button onclick="initAdmin()">切换为上帝主持</button>
        </div>

        <div id="game" class="screen hidden">
            <div id="status-bar">
                <span id="my-role-display"></span>
            </div>

            <div id="mask" class="active">
                <div class="moon">🌙</div>
                <h3>请闭眼</h3>
            </div>

            <div id="action-layer" class="hidden">
                <h2 id="action-prompt">请选择</h2>
                <div id="targets" class="grid"></div>
                <div id="extra-actions"></div>
            </div>

            <div id="day-layer" class="hidden">
                <h1>天亮了</h1>
                <p id="day-result"></p>
                <div id="day-vote-panel"></div>
            </div>
        </div>

        <div id="admin" class="screen hidden">
            <h2>上帝控制台</h2>
            <p style="font-size:12px; color:#aaa;">保持此页面常亮用于主持</p>
            <div class="role-settings">
                <h3>开局配置</h3>
                <div class="role-grid">
                    <div class="role-item"><span>狼人</span><input id="admin-role-wolf" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>狼枪</span><input id="admin-role-wolfKing" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>女巫</span><input id="admin-role-witch" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>预言家</span><input id="admin-role-seer" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>猎人</span><input id="admin-role-hunter" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>白痴</span><input id="admin-role-idiot" type="number" min="0" value="1"></div>
                    <div class="role-item"><span>混血儿</span><input id="admin-role-hybrid" type="number" min="0" value="1"></div>
                </div>
            </div>
            <div class="control-panel">
                <button onclick="startGame()">1. 发牌并入夜</button>
                <button onclick="nextPhase('hybrid')">2. 混血儿认榜样(仅第一夜)</button>
                <button onclick="nextPhase('wolf')">3. 唤醒狼人/狼枪</button>
                <button onclick="nextPhase('witch')">4. 唤醒女巫</button>
                <button onclick="nextPhase('seer')">5. 唤醒预言家</button>
                <button onclick="nextPhase('day_announce')" class="btn-day">6. 天亮结算</button>
                <button onclick="dayVoteOut()" class="btn-day">7. 白天投票出局</button>
                <div class="role-item" style="max-width: 200px; margin: 10px auto;">
                    <span>移交给玩家ID</span>
                    <input id="transfer-player-id" type="number" min="1">
                </div>
                <button onclick="transferAdmin()">移交上帝</button>
                <button onclick="releaseAdmin()">退出上帝模式</button>
            </div>
            <div id="admin-log"></div>
        </div>
    </div>
</body>
</html>
